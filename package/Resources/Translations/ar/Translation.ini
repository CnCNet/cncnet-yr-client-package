INI:Controls:UpdaterOptionsPanel:lblUpdateChannelDescription:Text=**تحذير**: استخدام قناة المطورين قد يؤدي إلى أخطاء غير متوقعة@تهدف هذه القناة للسماح للعامة باختبار الميزات القادمة@قبل إصدارها رسميًا. الرجاء استخدام الديسكورد@للإبلاغ عن أي مشاكل مع ذكر قناة التحديث المستخدمة.; **WARNING**: Using the Dev channel may bring unexpected errors or behavior.@It is meant to allow public testing of upcoming features before they are released. Please use@Discord to report any issues and be sure to mention the Update Channel you are using.
