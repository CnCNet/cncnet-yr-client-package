INI:Controls:GameOptionsPanel:chkDisableGameSpeed:ToolTip=منع تغيير سرعة اللعب أثناء المباراة.; Disable game speed adjustment in game.
INI:Controls:GameOptionsPanel:chkChatEnabled:Text=تعطيل الدردشة; Chat Disabled
INI:Controls:GameOptionsPanel:chkChatEnabled:ToolTip=عند تفعيل هذا الخيار، لن تتمكن من إرسال أو استقبال رسائل داخل اللعبة.; When disabled, you will not be able to send or receive messages in-game.
INI:Controls:GameOptionsPanel:chkAimableSams:Text=توجيه SAMs; Aimable SAMs
INI:Controls:GameOptionsPanel:chkAimableSams:ToolTip=يسمح للاعب بتوجيه مواقع الـSAM لاستهداف طائرات محددة.; Allow players to give orders to target specific aircraft with SAM sites.
INI:Controls:GameOptionsPanel:chkAltToUndeploy:Text=فكّ النشر عند الضغط على Alt; Hold Alt to Undeploy
INI:Controls:GameOptionsPanel:chkAltToUndeploy:ToolTip=فكّ نشر الوحدات عبر الضغط على Alt أثناء إعطاء أمر الحركة.; Undeploy units by holding [Alt] while moving.
INI:Controls:GameOptionsPanel:chkAttackNeutralUnits:Text=الهجوم على الوحدات المحايدة; Auto-target Neutrals
INI:Controls:GameOptionsPanel:chkAttackNeutralUnits:ToolTip=الوحدات ستهاجم تلقائياً الوحدات المحايدة المسلحة.; Units automatically attack armed neutral units.
INI:Controls:GameOptionsPanel:chkBases:Text=القواعد; Bases
INI:Controls:GameOptionsPanel:chkBases:ToolTip=يبدأ اللاعبون قاعدة بناء متحركة (قبم).; Players start with MCV.
INI:Controls:GameOptionsPanel:chkBlackChatBackground:Text=خلفية دردشة سوداء; Dark Chat Background
INI:Controls:GameOptionsPanel:chkBlackChatBackground:ToolTip=استخدام خلفية سوداء للرسائل داخل اللعبة.; Use black background for in-game chat messages.
INI:Controls:GameOptionsPanel:chkBuildOffAlly:Text=البناء قرب الحلفاء; Build Off Ally
INI:Controls:GameOptionsPanel:chkBuildOffAlly:ToolTip=يسمح بالبناء بالقرب مباني الحلفاء.; Allow building next to allied structures.
INI:Controls:GameOptionsPanel:chkCrates:Text=صناديق عشوائية; Crates Appear
INI:Controls:GameOptionsPanel:chkCrates:ToolTip=ستظهر صناديق عشوائية على الخريطة.; Random Power-Up Crates will appear.
INI:Controls:GameOptionsPanel:chkDestrBridges:Text=جسور قابلة للتدمير; Destroyable Bridges
INI:Controls:GameOptionsPanel:chkDestrBridges:ToolTip=يمكنك استهداف الجسور لتدميرها.; You can destroy bridges by force-firing on them.
INI:Controls:GameOptionsPanel:chkHarderAI:Text=لاعب آلي أصعب; Harder AI
INI:Controls:GameOptionsPanel:chkHarderAI:ToolTip=اللاعب الالي يكون أصعب بمراحل من المعتاد عند تفعيل الخيار; AI is much harder than default.
INI:Controls:GameOptionsPanel:chkImmuneHarvs:Text=حصادات منيعة; Immune Harvesters
INI:Controls:GameOptionsPanel:chkImmuneHarvs:ToolTip=تصبح الحصادات منيعة@(ولكنها لن تتمكن بعد الآن من سحق المشاة).; Harvesters are indestructible (but are no longer able to crush infantry).
INI:Controls:GameOptionsPanel:chkInfiniteTiberium:Text=تيبيريوم دائم; Infinite Tiberium
INI:Controls:GameOptionsPanel:chkInfiniteTiberium:ToolTip=يبقى التيبيريوم يستمر أكثر و أكثر قيمة.; Tiberium lasts longer and is more valuable.
INI:Controls:GameOptionsPanel:chkIngameAllying:Text=تحالف داخل اللعبة; Ingame Allying
INI:Controls:GameOptionsPanel:chkIngameAllying:ToolTip=يمكن للاعبين تكوين وكسر التحالفات أثناء اللعبة.@اختر مبنى أو وحدة اللاعب المراد تحالف واضغط@A/ش على لوحة المفاتيح لاقتراح تحالف.; Players can form and break alliances in the middle of the game by selecting a unit or structure of another human player and then pressing "A" on the keyboard.
INI:Controls:GameOptionsPanel:chkMultiEng:Text=عدة مهندسين; Multi Engineer
INI:Controls:GameOptionsPanel:chkMultiEng:ToolTip=استيلاء على المباني يتطلب 3 مهندسين بدلاً من 1.; Capturing a structure requires three Engineers instead of one.
INI:Controls:GameOptionsPanel:chkMultipleFactory:Text=مكافأة تعدد المصانع; Multiple Factory Bonus
INI:Controls:GameOptionsPanel:chkMultipleFactory:ToolTip=تعدد المصانع يزيد من سرعة@الإنتاج بنسبة 17.6% للمصنع الواحد.; Building multiple factories will speed up production of whatever that factory can produce by 17.6% per factory.
INI:Controls:GameOptionsPanel:chkRedeplMCV:Text=(ق.ب.م) قابلة للطي; Re-Deployable MCV
INI:Controls:GameOptionsPanel:chkRedeplMCV:ToolTip=يمكن إعادة طيّ ساحة البناء إلى قاعدة البناء المتحركة.; Construction Yard can repack into Mobile Construction Vehicle..
INI:Controls:GameOptionsPanel:chkRevealShroud:Text=كشف كامل للخريطة; Revealed Map
INI:Controls:GameOptionsPanel:chkRevealShroud:ToolTip=تشغيل الخريطة بدون ضباب الحرب.; The map will be entirely unshrouded when the game starts.
INI:Controls:GameOptionsPanel:chkScrollCoasting:ToolTip=تفعيل التمرير السلس.; Enable smooth scrolling.
INI:Controls:GameOptionsPanel:chkShortGame:Text=لعبة قصيرة; Short Game
INI:Controls:GameOptionsPanel:chkShortGame:ToolTip=إذا لم يتبق سوى وحدات دون مباني،@فستدمر الوحدات نفسها ويفوز اللاعب.; Having only units and no structures left will cause the units to self-destruct and make the player instantly lose the game.
INI:Controls:GameOptionsPanel:chkSilos:Text=استخدام صوامع; Silos Needed
INI:Controls:GameOptionsPanel:chkSilos:ToolTip=لا بحاجة لبناء معامل مصافي/صوامع إضافية لتخزين فائض التيبيريوم.; You don't need to build extra Refineries/Silos to store a lot of credits.
INI:Controls:GameOptionsPanel:chkSuperWeapons:Text=أسلحة دمار شامل; Super Weapons
INI:Controls:GameOptionsPanel:chkSuperWeapons:ToolTip=مسموح للاعبين باستخدام أستخدام  الدمار الشامل@مثل الصواريخ المتعددة ومدفع أيون.; Players can use super weapons such as the multi-missile and ion cannon.
INI:Controls:GameOptionsPanel:chkTargetLines:ToolTip=إظهار خطوط الأهداف.@الخطوط الخضراء تشير إلى الحركة، والحمراء إلى الهجوم.; Show lines between selected units and targets.@Green lines indicate movement, red lines attack.
INI:Controls:GameOptionsPanel:chkTooltips:ToolTip=تفعيل الشرح التفصيلي داخل اللعبة على الشريط الجانبي.; Enable in-game tooltips.
INI:Controls:GameOptionsPanel:chkVisceroids:Text=الفيزيرويدات; Visceroids
INI:Controls:GameOptionsPanel:chkVisceroids:ToolTip=المشاة الذين يموتون بسبب السير على التيبيريوم سيصبحون فيزيرويدات،@وبعض الخرائط ستحتوي على فيزيرويدات من البداية.; Infantry that die from walking over tiberium will become visceroids and some maps will already have visceroids present from the start.
INI:Controls:GameOptionsPanel:cmbCredits:OptionName=رصيد البداية; Starting Credits
INI:Controls:GameOptionsPanel:cmbCredits:ToolTip=الأموال في بداية اللعبة.; Credits at the start of the game.
