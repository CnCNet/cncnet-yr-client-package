INI:Controls:DisplayOptionsPanel:ddRenderer:ToolTip=اختر تغليف DirectDraw الذي تريد استخدامه.@إذا كنت تواجه مشاكل رسومية أو مشاكل في@الأداء، فجرب استخدام تغليف مختلف.;Select the DDraw wrapper to use. If you experience graphical or performance issues, try a different wrapper.
