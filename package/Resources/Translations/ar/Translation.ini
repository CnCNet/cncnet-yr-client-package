Client:Main:AutoAllyingText1=يسمح التحالف التلقائي للمضيف بربط مواقع البداية بالفرق بدلاً من اللاعبين.@عند تعيين اللاعبين في مواقع مرتبطة، ينضمون تلقائياً للفرق.@هذه أفضل طريقة لتوزيع عشوائي للفرق والمواقع. لكنها تتطلب فرقاً عشوائية فقط.@المواقع المحددة يدوياً لها الأولوية.;Auto allying allows the host to assign starting locations to teams, not players.@When players are assigned to spawn locations, they will be auto assigned to teams based on these mappings.@This is best used with random teams and random starts. However, only random teams is required.@Manually specified starts will take precedence.
