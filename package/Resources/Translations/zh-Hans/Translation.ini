INI:Maps:Maps\Yuri's Revenge\c1a01md:Briefing=古巴的苏军基地对美国本土构成威胁，必须将其消灭。@@指挥官1将控制我们靠近海岸的秘密空军司令部。@@指挥官2将保卫哈瓦那市。; Soviet bases in Cuba pose a threat to the Continental United States@so they must be eliminated.@@Commander 1 will take control of our secret Air Force Command@near the coast.@@Commander 2 will secure the city of Havana.
