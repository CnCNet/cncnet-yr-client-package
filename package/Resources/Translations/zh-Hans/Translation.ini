INI:Maps:Maps\Yuri's Revenge\blitz_breaking_bad:Briefing=- 闪电战 Mod@- 顶部的空指部允许建造航母大黄蜂！@大黄蜂伤害略低于黑鹰。@空指部可被摧毁。@底部有可占领的基因突变器。; - Blitz Mod@- Top Airforce Command allows building Aircraft Carrier Hornets!@Hornet damage is slightly less than Black Eagle.@The Airforce Command is destructible.@Capturable Mutator at bottom
