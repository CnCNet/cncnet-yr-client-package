INI:Maps:Maps\Yuri's Revenge\blitz_boom_2v2:Briefing=- 闪电战 mod，预占油井和电力，中下机场提供疯狂伊万，中心的心灵控制器无法被摧毁，中上每三分钟出现一辆恐怖分子。; - Blitz mod, pre cap oil and power, airport bottom mid gives crazy ivan, psych dom in center cant be destroyed, demo truck top mid every three mins
