INI:Maps:Maps\Yuri's Revenge\blitz_boom:Briefing=- 盟军阵营拥有所有盟军阵营加成（法国除外）。@- 苏军阵营拥有所有苏军阵营加成。尤里是苏军。@- 无矿石，建造油井赚钱（消耗35电力）。@- 所有玩家建筑对工程师免疫。@- 超时空军团兵无法攻击油井。@- 每局游戏最多可建造12个油井。@- 预占科技电厂和油井。@- 心灵控制器坚不可摧且可被占领。@- 每10游戏分钟在顶部产生带有闪电的爆破箱。@- 科技机场提供一次性疯狂伊万伞兵。@----------------------------------------------------------------------@闪电战 Mod 作者：Burg, Snark, Bbglas007, NuclearKommando; - Allied factions have all Allied faction bonuses (Minus France).@- Soviet factions have all Soviet faction bonuses. Yuri Is Sov.@- No Ore Build Oil For Money (Consumes 35 Power).@- All player buildings are engi immune.@- Chrono Legionnaires can't attack oils.@- Limit of 12 oils can be built per game.@- Tech Power Plant and Oil precaptured.@- Psychic Dominator is indestructible & Capturable.@- Demo crate spawn with lightning at the top every 10 ingame minutes.@- Tech Airport grants single Crazy Ivan paradrop.@----------------------------------------------------------------------@Blitz Mod by: Burg, Snark, Bbglas007, NuclearKommando
