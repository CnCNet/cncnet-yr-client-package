INI:Maps:Maps\Yuri's Revenge\c1a02md:Briefing=尤里已在好莱坞山建立了基地。@@指挥官1将负责洛杉矶国际机场周围的区域。@@指挥官2将指挥高速公路以东的电力和石油设施。; Yuri has managed to establish bases in the Hollywood Hills.@@Commander 1 will take charge of the area around LAX.@@Commander 2 will take command of the power and oil facilities@just east of the freeway.
INI:Maps:Maps\Yuri's Revenge\c1a02md:Description=[2] 盟军战役任务2; [2] Allied Campaign Mission 2
INI:Maps:Maps\Yuri's Revenge\c1a03md:Briefing=你们已成功将尤里和他的俄罗斯盟友赶回苏军。@@是时候了结他们了，指挥官们。@@建立你的基地，结束这场战争。; You have successfully driven Yuri and his Russian allies back@into the USSR.@@The time has come to finish them, Commanders.@@Establish your bases and end this war.
INI:Maps:Maps\Yuri's Revenge\c1a03md:Description=[2] 盟军战役任务3; [2] Allied Campaign Mission 3
INI:Maps:Maps\Yuri's Revenge\c2s01md:Briefing=美国人相信他们能守住西雅图。@@粉碎他们的防御阵地，让我们去进行更光荣的战斗。@@指挥官1将指挥我们的海军部队，@@而指挥官2则准备进行毁灭性的装甲突击。; The Americans believe they can hold Seattle.@@Crush thier defensive positions and let us move on@to more glorious battles.@@Commander 1 will take command of our naval forces,@@while Commander 2 prepares for a crushing armored assault.
INI:Maps:Maps\Yuri's Revenge\c2s01md:Description=[2] 苏军战役任务1; [2] Soviet Campaign Mission 1
INI:Maps:Maps\Yuri's Revenge\c2s02md:Briefing=叛徒尤里正在埃及沙漠中重建他的部队。@@指挥官1将负责我们沿尼罗河的旧基地。@@指挥官2必须保护我们位于尤里前线以南的油田。; The traitor Yuri is rebuilding his forces in the Egyptian desert.@@Commander 1 will take charge of our old base along the Nile.@@Commander 2 must protect our oil fields just south of Yuri's front lines.
INI:Maps:Maps\Yuri's Revenge\c2s02md:Description=[2] 苏军战役任务2; [2] Soviet Campaign Mission 2
INI:Maps:Maps\Yuri's Revenge\c2s03md:Briefing=看来德国的黑森林将是我们两个敌人的最终安息之地。@他们都在徒劳地寻找爱因斯坦的实验室，希望它能给他们带来生存的希望。@情报已查明为爱因斯坦实验室供电的核反应堆的位置。@@巩固你的阵地，然后找出并一劳永逸地消灭苏维埃国家的敌人。; It appears the Black Forest of Germany will be the final@resting place of both our enemies.@Both seek out Einstein's laboratory in vain hope it will give them hope@of survival.@Intelligence has pin pointed the location of the nuclear reactors@that must surely power Einstein's lab.@@Secure your positions and then seek out and destroy@the enemies of the Soviet state once and for all.
INI:Maps:Maps\Yuri's Revenge\c2s03md:Description=[2] 苏军战役任务3; [2] Soviet Campaign Mission 3
INI:Maps:Maps\Yuri's Revenge\c3y01md:Briefing=盟军在他们珍贵的白宫周围建立了防御工事。@他们像受惊的孩子一样躲在他们的技术后面。@@建立你的基地，结束他们徒劳无功地阻止我们的企图。; The Allies have constructed defenses around their@precious White House.@They hide behind their technology like scared children.@@Establish your bases and end their poor mindless attempts@to hold us back.
INI:Maps:Maps\Yuri's Revenge\c3y01md:Description=[2] 尤里战役任务1; [2] Yuri Campaign Mission 1
INI:Maps:Maps\Yuri's Revenge\c3y02md:Briefing=红军设法窃取了盟军的光棱技术，并试图在尤卡坦丛林深处的一个秘密研究设施中开发他们自己的光棱塔版本。@我们将对他们的基地发动突袭，粉碎苏军最后的胜利希望。@@指挥官1将从一个小油田的北部开始。@@指挥官2将从一个当地机场的东部开始。; The Red Army has managed to steal the Allies prism technology@and is trying to develop their own version of the Prism Tower@at a secret research facility deep in the Yucatan jungle.@We will launch a surprise attack on their base@and squash the Soviets last hope for victory.@@Commander 1 will begin north of a small oil field.@@Commander 2 will begin just east of a local airport.
INI:Maps:Maps\Yuri's Revenge\c3y02md:Description=[2] 尤里战役任务2; [2] Yuri Campaign Mission 2
INI:Maps:Maps\Yuri's Revenge\c3y03md:Briefing=盟军和苏军联合起来对抗我们。@他们已将最后的部队集结在伦敦。@@指挥官1将控制我们在城里的油井@@而指挥官2将控制泰晤士河对岸的医院。@@这场胜利将确保尤里对世界的统治。; The Allies and Soviets have allied against us.@They have gathered the last of their forces in London.@@Commander 1 will control our oil derrick in the city@@and Commander 2 will control the hospital across the Thames.@@This victory will ensure Yuri's mastery of the world.
INI:Maps:Maps\Yuri's Revenge\c3y03md:Description=[2] 尤里战役任务3; [2] Yuri Campaign Mission 3
INI:Maps:Maps\Yuri's Revenge\c4w01md:Briefing=在苏军入侵之后，尤里在纽约市中心建立了两个基地。@不再受尤里控制的红军已与美国人结盟，以击败这个叛徒。; In the wake of the Soviet invasion, Yuri has established two bases@in the heart of New York City.@No longer under Yuri's control, the Red Army has allied with@the Americans to defeat the traitor.
INI:Maps:Maps\Yuri's Revenge\c4w01md:Description=[2] 联盟战役任务1; [2] Alliance Campaign Mission 1
