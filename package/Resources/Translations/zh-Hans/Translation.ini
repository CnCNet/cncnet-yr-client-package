INI:Maps:Maps\Yuri's Revenge\blitz_brute:Briefing=- 盟军阵营拥有所有盟军阵营加成（法国除外）。@- 苏军阵营拥有所有苏军阵营加成。尤里是苏军。@- 游戏计时器：10分钟。@- 无矿石，建造油井赚钱（消耗35电力）。@- 所有玩家建筑对工程师免疫。@- 超时空军团兵无法攻击油井。@- 每局游戏最多可建造12个油井。@- 预占科技油井和科技电厂。@- 基因突变器坚不可摧且可被占领。@----------------------------------------------------------------------@闪电战 Mod 作者：Burg, Snark, Bbglas007, NuclearKommando; - Allied factions have all Allied faction bonuses (Minus France).@- Soviet factions have all Soviet faction bonuses. Yuri Is Sov.@- Game Timer: 10 Minutes. @- No Ore Build Oil For Money (Consumes 35 Power).@- All player buildings are engi immune.@- Chrono Legionnaires can't attack oils.@- Limit of 12 oils can be built per game.@- Tech Oil and Tech Power Plant precaptured.@- Genetic Mutator is indestructible & Capturable.@----------------------------------------------------------------------@Blitz Mod by: Burg, Snark, Bbglas007, NuclearKommando
