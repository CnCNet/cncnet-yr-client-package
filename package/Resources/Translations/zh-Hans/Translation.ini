INI:Maps:Maps\Yuri's Revenge\blitz_big_little_lake:Briefing=- 盟军阵营拥有所有盟军阵营加成（法国除外）。@- 苏军阵营拥有所有苏军阵营加成。尤里是苏军。@- 无矿石，建造油井赚钱（消耗35电力）。@- 所有玩家建筑对工程师免疫。@- 超时空军团兵无法攻击油井。@- 每局游戏最多可建造12个油井。@- 每个玩家预占2个油井。@----------------------------------------------------------------------@闪电战 Mod 作者：Burg, Snark; - Allied factions have all Allied faction bonuses (Minus France).@- Soviet factions have all Soviet faction bonuses. Yuri Is Sov.@- No Ore Build Oil For Money (Consumes 35 Power).@- All player buildings are engi immune.@- Chrono Legionnaires can't attack oils.@- Limit of 12 oils can be built per game.@- 2 Oils per player precaptured.@----------------------------------------------------------------------@Blitz Mod by: Burg, Snark
