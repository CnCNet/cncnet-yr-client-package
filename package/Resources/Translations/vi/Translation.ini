Client:DTAConfig:IntegerScaledClient=Tỉ Lệ Số Nguyên;Integer Scaled Client
Client:DTAConfig:IntegerScaledClientToolTip=Bật tỷ lệ số nguyên. Tùy chọn này sẽ buộc client sử dụng độ phân giải gần nhất cần thiết để đảm bảo không bị mờ, nhưng có thể gây ra các viền đen ở một số độ phân giải.@@Ngoài ra, bật tùy chọn này cũng cho phép thay đổi kích thước cửa sổ của client (không ảnh hưởng đến độ phân giải đã chọn của client).;Enable integer scaling for the client. This will cause the client to use@the closest fitting resolution that is required to maintain sharp graphics,@at the expense of black borders that may appear at some resolutions.@@Additionally, enabling this option will also allow the client window @to be resized (does not affect the selected client resolution).
