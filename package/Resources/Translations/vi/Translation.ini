INI:Maps:Maps\Yuri's Revenge\c1a01md:Description=[2] Chiến Dịch Đồng Minh: Nhiệm Vụ 1;[2] Allied Campaign Mission 1
INI:Maps:Maps\Yuri's Revenge\c1a01md:Briefing=Các căn cứ Xô Viết ở Cuba là mối đe dọa đối với Lục Địa Hoa Kỳ, vì vậy chúng phải bị loại bỏ.@@Chỉ huy 1 sẽ kiểm soát lực lượng không quân bí mật ở ven biển.@@Chỉ huy 2 sẽ bảo vệ thành phố Havana.;Soviet bases in Cuba pose a threat to the Continental United States@so they must be eliminated.@@Commander 1 will take control of our secret Air Force Command@near the coast.@@Commander 2 will secure the city of Havana.
INI:Maps:Maps\Yuri's Revenge\c1a02md:Description=[2] Chiến Dịch Đồng Minh: Nhiệm Vụ 2;[2] Allied Campaign Mission 2
INI:Maps:Maps\Yuri's Revenge\c1a02md:Briefing=Yuri đã thiết lập căn cứ trên đồi Hollywood.@@Chỉ huy 1 sẽ kiểm soát khu vực quanh sân bay chính của Los Angeles.@@Chỉ huy 2 sẽ chỉ huy khu phức hợp năng lượng - dầu khí.;Yuri has managed to establish bases in the Hollywood Hills.@@Commander 1 will take charge of the area around LAX.@@Commander 2 will take command of the power and oil facilities@just east of the freeway.
INI:Maps:Maps\Yuri's Revenge\c1a03md:Description=[2] Chiến Dịch Đồng Minh: Nhiệm Vụ 3;[2] Allied Campaign Mission 3
INI:Maps:Maps\Yuri's Revenge\c1a03md:Briefing=Ngài đã đẩy lùi thành công Yuri và các đồng minh Nga của hắn trở lại Liên Xô.@@Đã đến lúc kết liễu hắn, Chỉ huy.@@Hãy triển khai căn cứ và chấm dứt cuộc chiến này.;You have successfully driven Yuri and his Russian allies back@into the USSR.@@The time has come to finish them, Commanders.@@Establish your bases and end this war.
INI:Maps:Maps\Yuri's Revenge\c2s01md:Description=[2] Chiến Dịch Xô Viết, Nhiệm Vụ 1;[2] Soviet Campaign Mission 1
INI:Maps:Maps\Yuri's Revenge\c2s01md:Briefing=Quân Mỹ tin rằng chúng có thể tử thủ được Seattle.@@Hãy tiêu diệt các vị trí phòng thủ của địch để mở đường cho chúng ta tìm những trận chiến hoành tráng hơn.@@Chỉ huy 1 sẽ chỉ huy lực lượng hải quân,@@trong khi Chỉ huy 2 sẽ chuẩn bị lực lượng xe tăng để phá vỡ phòng thủ.;The Americans believe they can hold Seattle.@@Crush thier defensive positions and let us move on@to more glorious battles.@@Commander 1 will take command of our naval forces,@@while Commander 2 prepares for a crushing armored assault.
INI:Maps:Maps\Yuri's Revenge\c2s02md:Description=[2] Chiến Dịch Xô Viết, Nhiệm Vụ 2;[2] Soviet Campaign Mission 2
INI:Maps:Maps\Yuri's Revenge\c2s02md:Briefing=Tên phản bội Yuri đang tái thiết quân đội riêng trong sa mạc Ai Cập.@@Chỉ huy 1 sẽ chỉ huy lại căn cứ cũ dọc theo sông Nile.@@Chỉ huy 2 phải bảo vệ các mỏ dầu phía nam tuyến phòng thủ của Yuri.;The traitor Yuri is rebuilding his forces in the Egyptian desert.@@Commander 1 will take charge of our old base along the Nile.@@Commander 2 must protect our oil fields just south of Yuri's front lines.
INI:Maps:Maps\Yuri's Revenge\c2s03md:Description=[2] Chiến Dịch Xô Viết, Nhiệm Vụ 3;[2] Soviet Campaign Mission 3
INI:Maps:Maps\Yuri's Revenge\c2s03md:Briefing=Có vẻ như Rừng Đen ở Đức sẽ phòng tuyến cuối cùng của hai kẻ thù. Đồng Minh và Yuri đang tìm kiếm Khu Nghiên Cứu của Einstein với hy vọng rằng điều này sẽ giúp chúng sống sót. Tình báo đã xác định được vị trí của các lò phản ứng hạt nhân cung cấp năng lượng cho Khu Nghiên Cứu Einstein.@@Dọn dẹp bãi đáp, sau đó tìm và tiêu diệt kẻ thù của Xô Viết một lần và mãi mãi.;It appears the Black Forest of Germany will be the final@resting place of both our enemies.@Both seek out Einstein's laboratory in vain hope it will give them hope@of survival.@Intelligence has pin pointed the location of the nuclear reactors@that must surely power Einstein's lab.@@Secure your positions and then seek out and destroy@the enemies of the Soviet state once and for all.
INI:Maps:Maps\Yuri's Revenge\c3y01md:Description=[2] Chiến Dịch Yuri: Nhiệm Vụ 1;[2] Yuri Campaign Mission 1
INI:Maps:Maps\Yuri's Revenge\c3y01md:Briefing=Đồng Minh đã xây dựng tuyến phòng thủ xung quanh Nhà Trắng quý giá của họ. Quân địch ẩn mình sau công nghệ của riêng như những đứa trẻ co rúm vì sợ hãi.@@Hãy triển khai căn cứ của người và kết thúc những nỗ lực vô nghĩa và ngu ngốc của họ để ngăn chặn chúng ta.;The Allies have constructed defenses around their@precious White House.@They hide behind their technology like scared children.@@Establish your bases and end their poor mindless attempts@to hold us back.
INI:Maps:Maps\Yuri's Revenge\c3y02md:Description=[2] Chiến Dịch Yuri: Nhiệm Vụ 2;[2] Yuri Campaign Mission 2
INI:Maps:Maps\Yuri's Revenge\c3y02md:Briefing=Hồng Quân đã đánh cắp công nghệ Lăng Kính của Đồng Minh thành công và đang cố gắng phát triển phiên bản tháp Lăng Kính của riêng mình tại một cơ sở nghiên cứu khoa học bí mật sâu trong rừng rậm Yucatan. Chúng ta sẽ bắt đầu cuộc tấn công bất ngờ vào căn cứ của họ và nghiền nát hy vọng chiến thắng cuối cùng của Xô Viết.@@Chỉ huy 1 sẽ đổ bộ từ phía Bắc, gần một mỏ dầu nhỏ.@@Chỉ huy 2 sẽ đổ bộ hơi về phía Đông của sân bay địa phương.;The Red Army has managed to steal the Allies prism technology@and is trying to develop their own version of the Prism Tower@at a secret research facility deep in the Yucatan jungle.@We will launch a surprise attack on their base@and squash the Soviets last hope for victory.@@Commander 1 will begin north of a small oil field.@@Commander 2 will begin just east of a local airport.
INI:Maps:Maps\Yuri's Revenge\c3y03md:Description=[2] Chiến Dịch Yuri: Nhiệm Vụ 3;[2] Yuri Campaign Mission 3
INI:Maps:Maps\Yuri's Revenge\c3y03md:Briefing=Đồng Minh và Xô Viết đã hợp tác chống lại chúng ta. Họ đã tập hợp các quân đội còn sót lại tại London.@@Chỉ huy 1 sẽ kiểm soát các giàn mỏ dầu của chúng ta trong thành phố,@@ trong khi Chỉ huy 2 sẽ kiểm soát bệnh viện ở bên kia sông Thames.@@Chiến thắng này sẽ thiết lập sự thống trị của Yuri trên toàn thế giới.;The Allies and Soviets have allied against us.@They have gathered the last of their forces in London.@@Commander 1 will control our oil derrick in the city@@and Commander 2 will control the hospital across the Thames.@@This victory will ensure Yuri's mastery of the world.
INI:Maps:Maps\Yuri's Revenge\c4w01md:Description=[2] Chiến Dịch Liên Minh: Nhiệm vụ 1;[2] Alliance Campaign Mission 1
INI:Maps:Maps\Yuri's Revenge\c4w01md:Briefing=Trong lúc Xô Viết ồ ạt xâm lược, Yuri đã triển khai hai căn cứ ngay trung tâm thành phố New York. Hồng Quân, không còn chịu sự kiểm soát của Yuri, đã liên kết với người Mỹ để đánh bại kẻ phản bội.;In the wake of the Soviet invasion, Yuri has established two bases@in the heart of New York City.@No longer under Yuri's control, the Red Army has allied with@the Americans to defeat the traitor.
