Client:DTAConfig:ForceUpdateConfirmText=CẢNH BÁO: Bắt buộc cập nhật sẽ dẫn đến các tệp sẽ được xác minh và tải xuống lại.@Điều này có thể khắc phục sự cố các tệp của trò chơi, nhưng đồng thời có thể xóa một@số chỉnh sửa cài đặt đã áp dụng cho phiên bản này. Cân nhắc với rủi ro của riêng bạn!@@Nếu bạn tiếp tục, cửa sổ cài đặt sẽ đóng lại và Client sẽ tiếp tục kiểm tra cập nhật.@@Bạn có chắc muốn bắt buộc cập nhật không?@;WARNING: Force update will result in files being re-verified@and re-downloaded. While this may fix problems with game@files, this also may delete some custom modifications@made to this installation. Use at your own risk!@@If you proceed, the options window will close and the@client will proceed to checking for updates.@@Do you really want to force update?@
