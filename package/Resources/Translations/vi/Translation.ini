Client:Main:AutoAllyingText1=Tự động liên minh cho phép chủ phòng gán vị trí khởi đầu theo đội, thay vì theo người chơi.@Khi người chơi xuất hiện tại vị trí đã được gán, họ sẽ tự động gia nhập vào đội.@Đây là cách tốt nhất để ngẫu nhiên hóa đội và vị trí. Tuy nhiên, cách này chỉ hoạt động với các đội được chọn ngẫu nhiên. Các vị trí được chỉ định thủ công sẽ được ưu tiên.@@;Auto allying allows the host to assign starting locations to teams, not players.@When players are assigned to spawn locations, they will be auto assigned to teams based on these mappings.@This is best used with random teams and random starts. However, only random teams is required.@Manually specified starts will take precedence.@@
