INI:Controls:CheaterScreen:lblDescription:Text=Đã phát hiện các tệp trò chơi đã bị chỉnh sửa. Chúng có thể@ảnh hưởng tiêu cực đến trải nghiệm chơi game.@@Bạn có chắc chắn muốn chấp nhận một trải nghiệm không chính thống@khi chơi nhiệm vụ/chiến dịch này không?;Modified game files have been detected. They could@affect the game experience.@@Are you sure you want to have an inauthentic experience@playing this mission/campaign?
INI:Controls:DisplayOptionsPanel:chkBackBufferInVRAM:Text=Bộ Đệm Khung Hình trong Bộ Nhớ Video;Back Buffer in Video Memory
INI:Controls:DisplayOptionsPanel:chkBackBufferInVRAM:ToolTip=Bộ đệm khung hình trong VRAM.@Làm giảm hiệu suất, tuy nhiên thiết lập này@là cần thiết trên một số hệ thống.;Enable back buffer in VRAM. Reduces performance, but is necessary on some systems.
INI:Controls:DisplayOptionsPanel:chkStretchMovies:Text=Kéo Giãn Phim;Stretch Videos
INI:Controls:DisplayOptionsPanel:ddDetailLevel:ToolTip=Chọn mức độ chi tiết. Các thiết lập thấp hơn sẽ giảm@số lượng hiệu ứng hình ảnh và tăng hiệu suất.;Select the level of detail. Lower levels will reduce visual effects and increase performance.
INI:Controls:DisplayOptionsPanel:ddRenderer:ToolTip=Chọn trình giả lập DirectDraw mà bạn muốn sử dụng.@Nếu bạn gặp sự cố đồ họa hoặc vấn đề về hiệu suất,@hãy thử sử dụng trình giả lập khác.;Select the DDraw wrapper to use. If you experience graphical or performance issues, try a different wrapper.
INI:Controls:GameOptionsPanel:chkChatEnabled:Text=Tắt Chat;Chat Disabled
INI:Controls:GameOptionsPanel:chkChatEnabled:ToolTip=Một khi tắt, bạn sẽ không thể gửi hoặc nhận tin nhắn trong game.;When disabled, you will not be able to send or receive messages in-game.
INI:Controls:GameOptionsPanel:chkAimableSams:Text=Phòng không có thể nhắm mục tiêu;Aimable SAMs
INI:Controls:GameOptionsPanel:chkAimableSams:ToolTip=Cho phép người chơi điều khiển phòng không nhắm vào@các phương tiện bay cụ thể.;Allow players to give orders to target specific aircraft with the selected SAM Site(s).
INI:Controls:GameOptionsPanel:chkAltToUndeploy:Text=Giữ phím ALT để Ngừng triển khai;Hold Alt to Undeploy
INI:Controls:GameOptionsPanel:chkAltToUndeploy:ToolTip=Ngừng triển khai bằng cách giữ phím Alt và ra lệnh di chuyển.;Undeploy units by holding the [Alt] key while giving a move command.
INI:Controls:GameOptionsPanel:chkAttackNeutralUnits:Text=Tự động đánh đơn vị trung lập;Auto-target Neutrals
INI:Controls:GameOptionsPanel:chkAttackNeutralUnits:ToolTip=Đơn vị sẽ tự động tấn công các đơn vị trung lập có vũ trang.;Units automatically attack armed neutral units.
INI:Controls:GameOptionsPanel:chkBases:Text=Căn Cứ;Bases
INI:Controls:GameOptionsPanel:chkBases:ToolTip=Người chơi bắt đầu với Xe Công Trình.;Players start with Mobile Construction Vehicles.
INI:Controls:GameOptionsPanel:chkBlackChatBackground:Text=Nền Đen Cho Chat;Dark Chat Background
INI:Controls:GameOptionsPanel:chkBlackChatBackground:ToolTip=Sử dụng nền đen cho chat trong game.;Use black background for in-game chat messages.
INI:Controls:GameOptionsPanel:chkBuildOffAlly:Text=Xây Ở Đất Đồng Minh;Build Off Ally
INI:Controls:GameOptionsPanel:chkBuildOffAlly:ToolTip=Cho phép xây dựng sát công trình của đồng minh.;Allow building next to structures of teammates.
INI:Controls:GameOptionsPanel:chkCrates:Text=Thùng;Crates
INI:Controls:GameOptionsPanel:chkCrates:ToolTip=Các thùng tiếp tế sẽ xuất hiện ngẫu nhiên trên bản đồ,@chúng cung cấp thêm tiền, Tiberium, hoặc đơn vị.;Collectable crates will appear in random locations on the map, granting credits, tiberium, units, unit powerups, multi-missiles, area heal, global heal or booby traps.
INI:Controls:GameOptionsPanel:chkDestrBridges:Text=Cầu Có Thể Phá Hủy;Destroyable Bridges
INI:Controls:GameOptionsPanel:chkDestrBridges:ToolTip=Bạn có thể phá hủy cầu bằng cách ra lệnh bắt buộc@tấn công vào chúng.;You can destroy low bridges by force-firing on them.
INI:Controls:GameOptionsPanel:chkHarderAI:Text=MÁY Khó Hơn;Harder AI
INI:Controls:GameOptionsPanel:chkHarderAI:ToolTip=MÁY trở nên khó hơn rất nhiều@ so với các MÁY thông thường trong Tiberian Sun.;The AI is much harder than the default AI of Tiberian Sun.
INI:Controls:GameOptionsPanel:chkImmuneHarvs:Text=Xe Khai Thác Bất Tử;Immune Harvesters
INI:Controls:GameOptionsPanel:chkImmuneHarvs:ToolTip=Các Xe Khai Thác trở nên bất tử@(tuy nhiên, chúng không thể cán bộ binh nữa).;Harvesters are indestructible (but are no longer able to crush infantry).
INI:Controls:GameOptionsPanel:chkInfiniteTiberium:Text=Tiberium Vô Hạn;Infinite Tiberium
INI:Controls:GameOptionsPanel:chkInfiniteTiberium:ToolTip=Tiberium trở nên giá trị hơn nhiều và được thu hoạch chậm hơn.;Tiberium is much more valuable and lasts longer than normally.
INI:Controls:GameOptionsPanel:chkIngameAllying:Text=Liên Minh;Ingame Allying
INI:Controls:GameOptionsPanel:chkIngameAllying:ToolTip=Người chơi có thể hủy và thiết lập liên minh trong khi chơi.@Chọn một công trình hoặc đơn vị của người chơi bạn muốn liên minh và nhấn@A trên bàn phím để đề nghị liên minh.;Players can form and break alliances in the middle of the game by selecting a unit or structure of another human player and then pressing "A" on the keyboard.
INI:Controls:GameOptionsPanel:chkMultiEng:Text=Đa Kỹ Sư;Multi Engineer
INI:Controls:GameOptionsPanel:chkMultiEng:ToolTip=Chiếm công trình cần 3 Kỹ Sư thay vì 1.;Capturing a structure requires three Engineers instead of one.
INI:Controls:GameOptionsPanel:chkMultipleFactory:Text=Tăng Chỉ Số Theo Số Lượng@Xưởng Cơ Khí;Multiple Factory Bonus
