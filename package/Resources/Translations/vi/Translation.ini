INI:Controls:UpdaterOptionsPanel:lblUpdateChannelDescription:Text=**CẢNH BÁO**: Việc sử dụng kênh Dev có thể dẫn đến hành vi bất ngờ và lỗi. Kênh cập nhật@này cho phép cộng đồng thử nghiệm các tính năng sắp tới trước khi chúng được phát hành chính@ thức. Vui lòng sử dụng Discord để báo cáo mọi vấn đề, nhớ ghi rõ kênh cập nhật đã sử dụng.;**WARNING**: Using the Dev channel may bring unexpected errors or behavior.@It is meant to allow public testing of upcoming features before they are released. Please use@Discord to report any issues and be sure to mention the Update Channel you are using.
