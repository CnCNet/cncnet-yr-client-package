[AutoMapOverlays]
; Icons drawn on map previews over tech buildings placed in the map.
; BuildingID,ImageFile,OwnerFilter,CellOffsetX,CellOffsetY[,Toggleable]
; A BuildingID ending in * matches every ID with that prefix (CAOILD5, CAOILD6 etc. on Blitz maps).
; Neutral skips buildings that start the game already captured. The offsets centre the icon on the foundation.
0=CAOILD*,techoilderrick.png,Neutral,1,1,true
1=CAAIRP,techairport.png,Neutral,1,1,true
2=CATHOSP,techhospital.png,Neutral,3,2,true
3=CAOUTP,techoutpost.png,Neutral,2,1,true
4=CAPOWR,techpowerplant.png,Neutral,1,1,true
5=CAMACH,techmachineshop.png,Neutral,1,1,true
6=CASLAB,techsecretlab.png,Neutral,1,1,true

