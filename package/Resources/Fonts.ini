[TextShaping]
Enabled=true		; Shaping enabled. More performance intensive, but has letters laid out correctly
EnableBiDi=true		; Enable bidirectional text support (mixed LTR/RTL) for Arabic text
CacheSize=100		; Number of shaped text entries to cache. Higher values use more memory but improve performance


[Fonts]
Count=5

;main text - chat messages, etc
[Font0]
Type=TrueType
Size=12
Path=Roboto-SemiBold.ttf
Fallback=2

;buttons, dropdowns, etc
[Font1]
Type=TrueType
Size=13
Path=Roboto-SemiBold.ttf
Fallback=2

;Allow emojis
[Font2]
Type=TrueType
Size=12
Path=NotoEmoji-SemiBold.ttf
Fallback=3

;Chinese Simplified
[Font3]
Type=TrueType
Size=12
Path=NotoSansSC-Medium.ttf
Fallback=4

;Arabic
[Font4]
Type=TrueType
Size=12
Path=NotoSansArabic_SemiCondensed-SemiBold.ttf